# electron-builder.yml
appId: "com.yhmr.imageoverlaytool"
productName: "ImageOverlayTool"
artifactName: "${productName}-${version}-${platform}-${arch}.${ext}"
publish:
  provider: "github"
  owner: "yhmr"
  repo: "ImageOverlayTool"
fileAssociations:
  - ext: "iot"
    name: "ImageOverlayTool Project"
    description: "Image Overlay Tool Project File"
directories:
  output: "release"
  buildResources: "assets"
files:
  - "out/**/*"
extraFiles:
  - from: "licenses.json"
    to: "licenses.json"
win:
  target:
    - "zip"
    - "nsis"
  icon: "assets/icon.ico"
nsis:
  artifactName: "${productName}-${version}-installer-${arch}.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: "always"
  createStartMenuShortcut: true
  runAfterFinish: true
linux:
  target:
    - "AppImage"
    - "deb"
  icon: "assets/icon.png"
  category: "Graphics"
