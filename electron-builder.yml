# electron-builder.yml
appId: "com.yhmr.imageoverlaytool"
productName: "ImageOverlayTool"
artifactName: "${productName}-${version}-${platform}-${arch}.${ext}"
fileAssociations:
  - ext: "iot"
    name: "ImageOverlayTool Project"
    description: "Image Overlay Tool Project File"
directories:
  output: "release"
  buildResources: "assets"
files:
  - "out/**/*"
extraFiles:
  - from: "licenses.json"
    to: "licenses.json"
  - from: "LICENSE"
    to: "LICENSE"
  - from: "docs/store-submission/SOURCE_CODE_URL.txt"
    to: "SOURCE_CODE_URL.txt"
win:
  target:
    - "zip"
    - "nsis"
    - "appx"
  icon: "assets/icon.ico"
nsis:
  artifactName: "${productName}-${version}-installer-${arch}.${ext}"
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: "always"
  createStartMenuShortcut: true
  runAfterFinish: true
appx:
  artifactName: "${productName}-${version}-${arch}.${ext}"
  identityName: "yhmr.ImageOverlayTool"
  displayName: "Image Overlay Tool"
  publisher: "CN=371576BB-DE03-41A4-B137-1F16D17E3A56"
  publisherDisplayName: "yhmr"
  applicationId: "ImageOverlayTool"
linux:
  target:
    - "AppImage"
    - "deb"
  icon: "assets/icon.png"
  category: "Graphics"
