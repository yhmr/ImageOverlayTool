name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Electronなどのネイティブ依存関係がある場合、ヘッドレス環境でテストを実行するために必要なライブラリを追加
      - name: Install Linux dependencies for Electron
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libx11-xcb1 libnss3 libxss1 libasound2 libxtst6 xauth xvfb

      # JSDOM環境でCanvasを使用するためにcanvasパッケージをインストール（CI環境のみ）
      - name: Install canvas for JSDOM
        run: npm install canvas

      - name: Run tests
        run: npm run test
