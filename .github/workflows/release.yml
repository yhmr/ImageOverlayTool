name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  quality-gate:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate release metadata
        run: npm run prepare-release-assets

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Build application (for smoke e2e)
        run: npm run build

      - name: Run smoke e2e
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" -- npm run test:e2e:smoke

  store-license-terms:
    needs: quality-gate
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate release metadata
        run: npm run prepare-release-assets

      - name: Upload store license terms artifact
        uses: actions/upload-artifact@v4
        with:
          name: store-license-terms
          path: STORE_LICENSE_TERMS.txt
          if-no-files-found: error
          retention-days: 1

  build:
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux
          - os: windows-latest
            platform: win

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate release metadata
        run: npm run prepare-release-assets

      # Linux ARM64 クロスコンパイル用の依存関係
      - name: Install Linux ARM64 cross-compile dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build application
        run: npm run build

      # Windows ビルド
      - name: Build for Windows
        if: matrix.platform == 'win'
        run: npx electron-builder --win --x64 --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Linux ビルド
      - name: Build for Linux
        if: matrix.platform == 'linux'
        run: npx electron-builder --linux --x64 --arm64 --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.platform }}
          path: |
            release/*.zip
            release/*.exe
            release/*.appx
            release/*.appxbundle
            release/*.appxupload
            release/*.msix
            release/*.msixbundle
            release/*.msixupload
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/latest*.yaml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [build, store-license-terms]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List downloaded files
        run: find artifacts -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
